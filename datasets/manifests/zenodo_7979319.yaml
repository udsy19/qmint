format_by_inspection:
  layout: "{linear,diagonal}/{ttp,client}_chunk00..10.tsv (11 runs per basis); README; LICENSE_CC_BY; __MACOSX junk"
  tsv: >-
    ASCII text, LF, header line 'channel<TAB>tag', then '<int channel><TAB><decimal float ns>'.
    The record text '<uint8 c>\t<double t>' names column TYPES; data are NOT binary (no endianness /
    fixed record size). Times are relative per run (~1.6 s .. ~30 s), offset/drift-corrected by the authors.
  pairing: >-
    ttp_chunkNN and client_chunkNN have equal row counts and are row-paired: row i of each is one
    coincidence. All 8,964,878 pairs satisfy rint(t_ttp/3) == rint(t_client/3) (authors' 3-ns
    rounded-bin rule); max |dt| = 2.97 ns. 0 malformed, 0 duplicate, 0 out-of-range records.
  raw_ttm8000: "CRLF, '1 <channel> 1 <tick>'; tick = 82.3045 ps per authors' 01_a_prepdata2.py (not independently verified)"
  raw_identity: >-
    tagfile_example is the raw source of linear/chunk00: archived TTP times == SG - SG[0] to 4e-6 ns,
    channels agree 100%.
