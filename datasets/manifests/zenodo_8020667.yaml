findings_from_reading:
  - "01: reads TTM8000 text cols 1 (channel) and 3 (tick); ns = (tick - tick[0]) * 82.3045/1000."
  - "02: coarse start via shutter histogram, offset search at 100/10/1 ns bins, separate H/V client-channel delay, linear drift fit over 10-ms slices."
  - "03: coincidence = np.around(t/coincidence_time) equality; double clicks: TTP-side multi-bins dropped, client-side one kept at random (np.random, unseeded)."
  - "03: per-TTP-outcome probabilities P = counter/count (e.g. P_C0_V = counter24/count2); this per-state estimator, averaged, reproduces the paper's 1.45% / 3.28%."
  - "03 hard-codes coincidence_time = 1 for the shared table and bob channels 1/6, whereas the archive uses a 3-ns rule and client channels 2/4: the published script is not the exact configuration that produced the archive."
  - "drift_alt.py imports find_start_alt, absent from every version; requirements.txt referenced by README is absent: pipeline not runnable as published."
  - "No SDP / security-region code is included (paper Fig. 4 not reproducible from this record)."
