# QMint proof-obligation catalog / theorem registry (master plan section 3.6).
# Machine-readable source of truth, loaded and validated by qmint/proofs/registry.py.
#
# Conventions
#  * Every epsilon is an UPPER bound on a failure / adversary-win probability (C7). Never an error bar.
#  * `bounds[*].bound_id` is the theorem_id carried by qmint BoundResult values.
#  * `monotonicity` gives, for each parameter, the direction in which the bound gets WORSE (larger):
#      increasing -> worst case is the interval upper endpoint `hi`
#      decreasing -> worst case is the interval lower endpoint `lo`
#    It is used by qmint.proofs.assumption_check to propagate calibration intervals; the independent
#    checker re-derives the worst case by brute-force corner maximisation instead (separate code path).
#  * `domain_only` parameters enter the theorem's domain but not the bound's value; an interval for them
#    is checked on every corner and its endpoint choice does not affect the value.
#  * `required_declarations` are hypotheses that cannot be verified from numbers alone; a request must
#    declare each one in parameters["declared_assumptions"], otherwise the evaluator returns
#    ASSUMPTION_MISSING:<name> with no value.
#  * Status vocabulary: PUBLISHED_REPRODUCED | NUMERICALLY_SUPPORTED | CERTIFIED_NUMERIC | CONJECTURE | UNSUPPORTED
#  * Source documents were retrieved 2026-10-11; sha256 values are of the files as downloaded then
#    (publisher PDFs can be re-rendered, so a different hash is not by itself evidence of a change).

