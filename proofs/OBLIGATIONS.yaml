  - claim_id: P-D1
    protocol: schiansky_payment_2023
    game: D1
    source: SKSRGTBW2023
    source_and_theorem: "Schiansky et al. 2023 SI Note 3: N=1 SDP (Eqs. 14-15), analytic fit of the secure-region boundary (Eqs. 16-18), finite-N Chernoff bounds for honest (Eqs. 19-21) and dishonest (Eqs. 22-23) success; main text Fig. 4b."
    assumptions:
      - "Two merchants (one committed bit per sub-token); TTP honest; i.t.-secure MAC; Client's choice of merchant independent of external bias."
      - "Source emits states diagonal in photon number (SPDC; sigma_k of SI Note 3A with p0, p1, pm); multiphoton probability pm known."
      - "Attack model: general CPTP map on the token producing two classical cryptograms; TTP checks declared error e and loss l."
      - "N -> infinity: exponential de Finetti argument stated informally (SI Note 3B), i.e. collective attacks assumed asymptotically i.i.d."
      - "Finite N: Chernoff-Hoeffding (SI Eqs. 7-8) applied to the mishap count M(e,l) = (4+2 sqrt 2) e + l."
    required_declarations: [two_merchants_one_bit, honest_ttp, it_secure_mac, fock_diagonal_spdc_source, permutation_symmetric_iid_reduction]
    calibration_families: [schiansky_2023]
    finite_n_or_asymptotic: "finite N via Chernoff, on top of an asymptotic (de Finetti) reduction"
    parameters:
      N: "quantum states per committed bit (sub-token length)"
      p_m: "multiphoton emission probability"
      e_h: "honest error rate"
      l_h: "honest loss rate"
      delta_d: "dishonest tolerance (0,1]"
      delta_h: "honest tolerance (0,1]"
    quantifier_over_adversaries: "a malicious Client/Merchant applying any CPTP map to the token (SDP over Choi matrices, N=1), extended to N by an informal de Finetti argument"
    mathematical_bound: |
      p_d <= exp(-(delta_d^2/2) * (1/2)(1 - p_m/2) * N)                         [SI Eq. 22]
      1 - p_h <= exp(-(delta_h^2/3) * M(e_h,l_h) * N), M = (4+2 sqrt 2) e + l   [SI Eqs. 18-20]
      admissible iff (1/2)(1 - p_m/2)(1 - delta_d) >= M(e_h,l_h)(1 + delta_h)  [SI Eq. 23]
    numerical_method: "log space; reproduces p_d = 5.9e-45 at N=4.2e6, p_m=0.0602, delta_d=0.01"
    verification_script: "qmint/proofs/finite_size.py; tests/unit/proofs/test_finite_size.py"
    independent_crosscheck: "qmint/proofs/checker.py re-derives the numbers but REFUSES to certify (see caveats)"
    caveats:
      - "Secure-region boundary Eq. (16) is described by the authors as an analytic expression that FITS the numerical SDP optimum, not a proven closed form."
      - "The N->infinity step is an informal appeal to exponential de Finetti without finite-N correction terms."
      - "Chernoff bound (stated for sums of Bernoulli variables) is applied to the weighted mishap combination M(e,l)."
      - "p_d excludes the MAC tag-forgery probability p_t = 1/sqrt|C|; the paper chooses p_d ~ p_t but states no composed epsilon. QMint does not compose them."
      - "Main text quotes multiphoton probability 6.76 +- 0.12 %; SI Table 2 lists p_m = 6.02 +- 0.28 % and allowed mishaps 0.4849 = (1/2)(1 - p_m/2) consistent with 6.02 %. The published p_d reproduces with 6.02 %."
      - "Therefore results carry evidence kind PUBLISHED_AGGREGATE and status NUMERICALLY_SUPPORTED; the independent checker never marks a D1 certificate CERTIFIED."
    status: NUMERICALLY_SUPPORTED
    reproduced_examples:
      - "p_d = 5.911e-45 (SI Table 2) at N = 4.2e6, p_m = 0.0602, delta_d = 0.01 (ours 5.9e-45 within 1%)"
      - "M(e_m, l_m) for +/- basis: (4+2 sqrt2)(0.03278)+0.224 = 0.448 (SI Table 2: 0.448)"
      - "Eq. (23) admissible at delta_h = 0.031, delta_d = 0.01"
    bounds:
      - bound_id: P-D1/unf
        axis: epsilon_unf
        anchor: "Schiansky 2023 SI Eq. (22) (with Eq. (18) fit)"
        formula: "exp(-(delta_d^2/2)(1/2)(1-p_m/2) N)"
        domain: "0 < delta_d <= 1; 0 <= p_m < 1; Eq. (23) holds; two merchants"
        monotonicity: {p_m: increasing}
        domain_only: [e_h, l_h]  # enter Eq. (23) only, not the value
      - bound_id: P-D1/cor
        axis: epsilon_cor
        anchor: "Schiansky 2023 SI Eqs. (19)-(20)"
        formula: "exp(-(delta_h^2/3) M(e_h,l_h) N)"
        domain: "0 < delta_h <= 1; M(e_h,l_h) > 0; Eq. (23) holds"
        monotonicity: {e_h: decreasing, l_h: decreasing}
        domain_only: [p_m]  # enters Eq. (23) only, not the value

