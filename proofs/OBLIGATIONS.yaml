      - {file: "Supplementary Information 41467_2023_39519_MOESM1_ESM.pdf", sha256: "26e50b759192559e58e05a48a93d6ad70dd744da8ba975ee973266a46591a223"}
      - {file: "Peer review file 41467_2023_39519_MOESM2_ESM.pdf", sha256: "81e0bf98bee94278f8f2f81d366ac23f01462998ccf4f142551c80eaf8d6eeb1"}
    correction_status: "Author Correction doi:10.1038/s41467-023-40866-x (sha256 5018ada3a27042d8549d35f83e11be120effee9f6fad6eb08f4050f2d8df237c). It changes ONLY the Discussion paragraph on growing the MAC key C; it does not touch the security bound, the SDP, the Chernoff analysis or any number used here."

claims:

  - claim_id: P-W1
    protocol: wiesner_ideal
    game: W1
    source: MVW2012
    source_and_theorem: "MVW2012 Theorem 1 (p.2): optimal simple counterfeiting attack on Wiesner's scheme succeeds with probability exactly (3/4)^n."
    assumptions:
      - "Bank note = n qubits, each uniformly and independently one of |0>,|1>,|+>,|-> (secret to the adversary)."
      - "Adversary receives exactly ONE valid note and applies any quantum channel to output two notes (simple counterfeiting)."
      - "No access to a verification oracle; no repeated or adaptive verification; no leaked post-measurement states (MVW2012 p.2 explicitly excludes these)."
      - "Bank verifies each candidate independently with the exact projective test (all n qubits must be correct; zero error tolerance, no loss)."
    required_declarations: [uniform_bb84_product_state, single_note_no_oracle, exact_projective_verifier]
    finite_n_or_asymptotic: "exact for every finite n >= 1"
    parameters: {n: "number of qubits per note, integer >= 1"}
    quantifier_over_adversaries: "sup over ALL quantum channels (CPTP maps, unbounded ancilla and computation) from one note to two notes"
    mathematical_bound: "P_two_valid(n) = (3/4)^n (tight)"
    numerical_method: "log-space: log10 P = n*log10(3/4); float64 then cross-checked in Decimal(60 digits)"
    verification_script: "qmint/proofs/ideal_bounds.py; tests/unit/proofs/test_ideal_bounds.py"
    independent_crosscheck: "qmint/proofs/checker.py (Decimal re-derivation); n=1 SDP value 3/4 is lane C (qmint/attacks) deliverable"
    caveats:
      - "Not a bound for noisy/threshold verifiers (that is game W2), lossy channels, oracle access, or S-money."
      - "Does not cover the classical-verification variant (P-W1CV) and must not be used for it."
    status: PUBLISHED_REPRODUCED
    bounds:
      - bound_id: P-W1/unf
        axis: epsilon_unf
        anchor: "MVW2012 Theorem 1"
        formula: "(3/4)^n"
        domain: "n integer >= 1"
        monotonicity: {}

  - claim_id: P-W1CV
    protocol: wiesner_ideal
    game: W1_CV
    source: MVW2012
    source_and_theorem: "MVW2012 Theorem 2 (p.3): for the classical-verification analogue of Wiesner's scheme, the optimal simple counterfeiting attack succeeds in two independent verifications with probability exactly (3/4 + sqrt(2)/8)^n."
    assumptions:
      - "Note as in P-W1; verification = bank sends a uniformly random challenge c in {0,1}^n, holder returns measurement outcomes, bank checks positions where c matches the preparation basis."
      - "Adversary holds ONE valid note and tries to pass TWO independent classical verifications."
      - "Exact acceptance rule (no error tolerance, no loss), no other oracle access."
    required_declarations: [uniform_bb84_product_state, single_note_no_oracle, uniform_classical_challenge, exact_classical_verifier]
    finite_n_or_asymptotic: "exact for every finite n >= 1"
    parameters: {n: "number of qubits per note, integer >= 1"}
    quantifier_over_adversaries: "sup over all quantum strategies holding one note and answering two independent challenges"
    mathematical_bound: "(3/4 + sqrt(2)/8)^n (tight)"
    numerical_method: "log-space as P-W1"
    verification_script: "qmint/proofs/ideal_bounds.py; tests/unit/proofs/test_ideal_bounds.py"
    independent_crosscheck: "qmint/proofs/checker.py"
    caveats:
      - "A different game from W1; its base 0.9268 is LARGER than 3/4 - substituting (3/4)^n here would be optimistic."
    status: PUBLISHED_REPRODUCED
    bounds:
      - bound_id: P-W1CV/unf
        axis: epsilon_unf
        anchor: "MVW2012 Theorem 2"
        formula: "(3/4 + sqrt(2)/8)^n"
        domain: "n integer >= 1"
        monotonicity: {}

