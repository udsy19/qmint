  - claim_id: P-S1
    protocol: s_money_kent_2022_ideal_2site
    game: S1
    source: KLPR2022
    source_and_theorem: "KLPR2022 Lemma 1, Eq. (1) (main text p.5; proof SI Note IV): IQT1 and IQT2 are eps_unf-unforgeable with eps_unf = (1/2 + 1/(2*sqrt(2)))^N."
    assumptions:
      - "Ideal schemes IQT1/IQT2 of Table 1: N exact BB84 qubits with uniformly random states and bases; no loss, no preparation/measurement error, no multiphoton component."
      - "Exactly two presentation points (M = 1)."
      - "Bob (the bank) follows the scheme honestly; Bob's agents communicate over secure authenticated channels; Alice is arbitrary (unforgeability quantifies over dishonest Alice)."
    required_declarations: [ideal_no_loss_no_error, two_presentation_points, honest_bank_secure_agent_channels, uniform_bb84_states_and_bases]
    finite_n_or_asymptotic: "exact upper bound for every finite N >= 1"
    parameters: {N: "number of transmitted qubits, integer >= 1"}
    quantifier_over_adversaries: "for every (unbounded quantum) strategy of dishonest Alice, P[Bob accepts at both presentation points] <= eps_unf"
    mathematical_bound: "(1/2 + 1/(2 sqrt 2))^N"
    numerical_method: "log-space"
    verification_script: "qmint/proofs/ideal_bounds.py"
    independent_crosscheck: "qmint/proofs/checker.py"
    caveats:
      - "Not Wiesner's 3/4 bound. Not valid for the realistic schemes QT1/QT2 (use P-S2). No multi-site (M>1) version is stated for the IDEAL schemes; Theorem 2 concerns QT^M only."
      - "Privacy of IQT is argued in prose only (main text p.4); no numbered privacy lemma for IQT, so the evaluator returns no privacy value for S1."
    status: PUBLISHED_REPRODUCED
    bounds:
      - bound_id: P-S1/unf
        axis: epsilon_unf
        anchor: "KLPR2022 Lemma 1, Eq. (1)"
        formula: "(1/2 + 1/(2 sqrt 2))^N"
        domain: "N integer >= 1, M = 1"
        monotonicity: {}

  - claim_id: P-S2
    protocol: s_money_kent_2022_realistic
    game: S2
    source: KLPR2022
    source_and_theorem: "KLPR2022 Lemmas 2,3,4 (Eqs. 2-6; proofs SI Note V), Theorem 1 (Eqs. 7-10; proof SI Note VII), Theorem 2 (Eq. 11; SI Note VIII, Theorem 3 Eqs. 194-198) for the practical schemes QT1/QT2 (Tables 2,3) with imperfections of Table 5 and assumptions of Table 6."
    assumptions:
      - "Table 6 A: each qubit-labelled state is prepared from exactly two orthonormal qubit bases."
      - "Table 6 B: t and u are generated with exactly product (independent per-position) distributions with biases beta_PS, beta_PB."
      - "Table 6 C/D: the reported set Lambda gives Bob no information on Alice's bases W and bit z (follows from E,F with reporting strategy 1/2, Lemma 5)."
      - "Table 6 E: Bob cannot use undeclared degrees of freedom to affect/learn Alice's detectors (side channels excluded)."
      - "Table 6 F: Alice's detectors have equal efficiency; dark-count products equal; dark counts and detections independent."
      - "Table 6 G: from Alice's view Bob's pulses are Fock-state mixtures (phase-randomised / low-coherence source)."
      - "Table 5 item 1: multiphoton probability P_noqub > 0 is known (upper bounded); Table 5 item 2: basis misalignment angle theta in (0, pi/4)."
      - "Lemmas 2,3 use the Chernoff bounds of SI Proposition 1, which require INDEPENDENT Bernoulli rounds (detections, errors)."
      - "Unforgeability: Bob honest, Alice arbitrary; robustness/correctness: both honest; privacy: Alice honest, Bob arbitrary (under C-F)."
    required_declarations: [table6_A_two_bases, table6_B_product_distributions, table6_C_D_reporting_no_leak, table6_E_no_side_channels, table6_F_equal_detectors, table6_G_fock_mixtures, independent_rounds]
    calibration_families: [kent_2022]
    finite_n_or_asymptotic: "finite N (non-asymptotic Chernoff-type bounds)"
    parameters:
      N: "number of transmitted pulses per round (int >= 1)"
      M: "log2 of number of presentation points (int >= 1, default 1)"
      C: "number of pairs of spacelike-separated presentation points (Theorem 2 / SI Theorem 3); required when M > 1"
      P_det: "probability a transmitted state is reported as successfully measured"
      gamma_det: "abort threshold: Bob aborts iff n < gamma_det N"
      E: "Alice's error probability in the preparation basis (max over states/bases)"
      gamma_err: "validation error threshold"
      nu_cor: "free analysis variable of Lemma 3"
      beta_PB: "preparation-basis bias"
      beta_PS: "preparation-state bias"
      theta: "Bloch-sphere basis uncertainty angle in radians"
      P_noqub: "probability a pulse is not a qubit (multiphoton)"
      nu_unf: "free analysis variable of Theorem 1"
      beta_E: "bias of Alice's bit z"
    quantifier_over_adversaries: "eps_unf: for every strategy of dishonest Alice with unbounded quantum power (only indirect restriction via Table 6 G); eps_priv: for every strategy of Bob subject to Table 6 C-F."
    mathematical_bound: |
      eps_rob  = exp(-(P_det N/2)(1 - gamma_det/P_det)^2)                       [Eq. 3, domain Eq. 2]
      eps_cor  = exp(-(P_det(1-2b_PB)N/4)(1 - 2 nu_cor/(P_det(1-2b_PB)))^2)
                 + exp(-(E nu_cor N/3)(gamma_err/E - 1)^2)                     [Eq. 5, domain Eq. 4]
      eps_priv = beta_E                                                        [Eq. 6]
      eps_unf  = exp(-(P_noqub N/3)(nu_unf/P_noqub - 1)^2) + exp(-N f)         [Eq. 10, domain Eq. 7 and f > 0]
        f = (g_det - nu_unf)[lambda/2 (1 - delta/lambda)^2 - ln(1 + 2 b_PS)] - (1 - (g_det - nu_unf)) ln(1 + h)   [Eq. 8]
        h = 2 b_PS sqrt(1/2 + 2 b_PB^2 + (1/2 - 2 b_PB^2) sin(2 theta)),  delta = g_det g_err/(g_det - nu_unf)    [Eq. 9]
        lambda = (1/2)(1 - sqrt(1 - [1 - O(theta)^2](1 - 4 b_PB^2))),  O(theta) = (cos theta + sin theta)/sqrt 2  [Table 5 item 3, item 2]
      2^M points (Eq. 11): rob^M = M rob, cor^M = M cor, priv^M = 2^-M[(1 + 2 priv)^M - 1], unf^M = C unf, C = L(L-1)/2
    numerical_method: "natural-log space with log-sum-exp; constraints checked exactly as stated (strict inequalities)"
    verification_script: "qmint/proofs/finite_size.py; tests/unit/proofs/test_finite_size.py; qmint/proofs/reproduce.py"
    independent_crosscheck: "qmint/proofs/checker.py (Decimal, own trig series, brute-force interval corners)"
    caveats:
      - "Out-of-domain parameters (any constraint of Eqs. 2,4,7 violated, or f <= 0) return NO value, never an extrapolated exponential."
      - "The paper's own experimental tuple (beta_PB=2.4e-3, beta_PS=3.6e-3, theta<=10deg, E=0.058) does NOT satisfy Theorem 1 (f <= 0): unforgeability is not certified by the paper for its experiment, as the paper itself states."
      - "nu_cor, nu_unf, gamma_err are analysis/protocol choices; any admissible choice gives a valid bound."
      - "Assumptions A,B,E,F,G are physical idealisations that cannot be verified from counts; they must be declared and are flagged as such."
    status: PUBLISHED_REPRODUCED
    reproduced_examples:
      - "eps_rob = e^-1052 at N=4e7, P_det=0.019, gamma_det=0.018 (paper Methods p.12)"
      - "P_noqub = 1-(1+mu)e^-mu = 3.8e-3 at mu=0.09; P_det_theo = 2(e^{-mu eta/2} - e^{-mu eta}) = 0.01863 at eta=0.21 (Eq. 17)"
      - "beta_PB=2.4e-3, beta_PS=3.6e-3 and E=0.058 from the published counts (Methods p.13)"
      - "Fig. 5 beta_max: theta=10deg,E=0.058 -> paper 6e-6 (ours 6.9e-6); theta=5deg,E=0.03 -> paper 2.3e-4 (ours 2.25e-4); theta->0,E=0.01 -> paper ~6e-4 (ours 5.9e-4)"
    bounds:
      - bound_id: P-S2/rob
        axis: epsilon_rob
        anchor: "KLPR2022 Lemma 2, Eqs. (2)-(3); SI Eqs. (58)-(59)"
        formula: "M * exp(-(P_det N/2)(1-gamma_det/P_det)^2)"
        domain: "0 < gamma_det < P_det"
        monotonicity: {P_det: decreasing}
      - bound_id: P-S2/cor
        axis: epsilon_cor
        anchor: "KLPR2022 Lemma 3, Eqs. (4)-(5)"
        formula: "M * [exp(-(A N/4)(1-2 nu_cor/A)^2) + exp(-(E nu_cor N/3)(gamma_err/E-1)^2)], A = P_det(1-2 beta_PB)"
        domain: "0 < gamma_err/2 < E < gamma_err; 0 < nu_cor < P_det(1-2 beta_PB)/2"
        monotonicity: {P_det: decreasing, beta_PB: increasing, E: increasing}
      - bound_id: P-S2/priv
        axis: epsilon_priv
        anchor: "KLPR2022 Lemma 4, Eq. (6); 2^M points Eq. (11)"
        formula: "2^-M[(1 + 2 beta_E)^M - 1]  (= beta_E for M = 1); privacy defined as Bob's guessing prob <= 2^-M + eps_priv"
        domain: "0 < beta_E < 1/2"
        monotonicity: {beta_E: increasing}
      - bound_id: P-S2/unf
        axis: epsilon_unf
        anchor: "KLPR2022 Theorem 1, Eqs. (7)-(10); SI Eqs. (99)-(102); 2^M points Theorem 2 Eq. (11), SI Theorem 3 Eqs. (194)-(198)"
        formula: "C * [exp(-(P_noqub N/3)(nu_unf/P_noqub-1)^2) + exp(-N f)], C = 1 when M = 1"
        domain: "0 < gamma_err < lambda; 0 < P_noqub < nu_unf < min{2 P_noqub, gamma_det(1-gamma_err/lambda)}; 0 < beta_PS < (1/2)[exp((lambda/2)(1-delta/lambda)^2) - 1]; f > 0; 0 < theta < pi/4; 0 < beta_PB < 1/2"
        monotonicity: {P_noqub: increasing, beta_PB: increasing, beta_PS: increasing, theta: increasing}

