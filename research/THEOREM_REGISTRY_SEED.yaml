theorems:

  # ------------------------------------------------------------------ MVW 2012 (P01)
  - theorem_id: T-MVW12-THM1
    proof_obligation: P-W1
    game: W1
    source_paper_id: P01
    source_url: https://arxiv.org/abs/1202.4010
    anchor: "Theorem 1, p.2 (statement); Sec. 3.1 SDP p.7; Sec. 3.2 n=1 primal/dual p.7-8; Sec. 3.4 parallel repetition p.9-10"
    status: VERIFIED_FROM_SOURCE
    statement_verbatim: >-
      Theorem 1. The optimal simple counterfeiting attack against Wiesner's quantum money scheme
      has success probability exactly (3/4)^n, where n is the number of qubits in each bank note.
    bound_latex: 'P^{\mathrm{opt}}_{\mathrm{two\ valid}}(n)=\left(\tfrac34\right)^{n}'
    bound_plain: "(3/4)**n"
    variables:
      n: "number of qubits per bank note (positive integer)"
    game_definition: >-
      Bank picks key k uniformly at random, i.e. each of n qubits is |0>,|1>,|+>,|-> with probability 1/4
      independently (n-fold parallel repetition of the single-qubit ensemble, Sec. 3.4). The
      counterfeiter receives ONE note (register X) and applies any CPTP map Phi: L(X) -> L(Y (x) Z).
      Success = both Y and Z independently pass the bank's projective test {Pi=|psi_k><psi_k|, 1-Pi}
      (eq. 2, p.7: sum_k p_k <psi_k (x) psi_k| Phi(|psi_k><psi_k|) |psi_k (x) psi_k>).
    sdp_n1:
      primal: "maximize <Q,X> s.t. Tr_{Y(x)Z}(X) = 1_X, X >= 0 on Y(x)Z(x)X (p.7)"
      dual: "minimize Tr(Y) s.t. 1_{Y(x)Z} (x) Y >= Q, Y Hermitian on X (p.7)"
      Q: "Q = sum_k p_k |psi_k psi_k conj(psi_k)><psi_k psi_k conj(psi_k)| ; for Wiesner n=1: Q = (1/4)(|000><000| + |111><111| + |+++><+++| + |---><---|) (p.8)"
      subsystem_order: "Choi operator J(Phi) in L(Y (x) Z (x) X), output registers first, input last (Sec. 2.2: J(Phi) = sum_ij Phi(|i><j|) (x) |i><j|)"
      optimal_primal: "Phi(rho) = A0 rho A0^* + A1 rho A1^*, A0 = (1/sqrt12)[[3,0],[0,1],[0,1],[1,0]], A1 = (1/sqrt12)[[0,1],[1,0],[1,0],[0,3]] (4x2 matrices, output basis |00>,|01>,|10>,|11>) (p.8)"
      optimal_dual: "Y = (3/8) 1_X ; ||Q|| = 3/8 (p.8)"
      optimum: "3/4"
    assumptions:
      - "ideal, noiseless BB84 states; exact accept-all-qubits verifier"
      - "no access to the bank's verifier beyond the final two independent verifications"
      - "single genuine note as input"
    quantifier_over_adversaries: "all CPTP maps from one note to two candidate notes (unbounded quantum adversary)"
    tightness: "exact (optimal attack achieves the value)"
    not_valid_for:
      - "W1_CV (classical verification) -> use T-MVW12-THM2"
      - "W2 noisy/threshold verifier (per-copy thresholds) -> no closed form here"
      - "adaptive attacks with verification queries (paper p.2: 2^-n Bell attack; Lutomirski O(n) attack when post-measurement qubits are returned)"
      - "S1/S2 S-money games"
      - "m -> m+1 counterfeiting for m > 1 (not analysed)"
    verification:
      statement_verbatim: VERIFIED_FROM_SOURCE
      bound_latex: VERIFIED_FROM_SOURCE
      game_definition: VERIFIED_FROM_SOURCE
      sdp_n1: VERIFIED_FROM_SOURCE
      optimum_n1_recomputed: RECOMPUTED_BY_LANE_A
    recomputation_notes: >-
      Lane A checked with numpy that the Kraus pair above is trace preserving, gives success 0.75
      on the 4-state ensemble, and that ||Q|| = 0.375. This is a consistency check of the
      transcription. It doesn't replace lane C's SDP.

  - theorem_id: T-MVW12-THM2
    proof_obligation: P-W1-CV
    game: W1_CV
    source_paper_id: P01
    source_url: https://arxiv.org/abs/1202.4010
    anchor: "Theorem 2, p.3; game Sec. 4.1 eq.(8) p.13; Lemma 5 and proof p.14; matching lower bound Lemma 6 p.15"
    status: VERIFIED_FROM_SOURCE
    statement_verbatim: >-
      Theorem 2. For the classical-verification analogue of Wiesner's quantum money scheme, the
      optimal simple counterfeiting attack has success probability exactly (3/4 + sqrt(2)/8)^n, for
      n being the number of qubits in each bank note.
    bound_latex: 'P^{\mathrm{opt}}(n)=\left(\tfrac34+\tfrac{\sqrt2}{8}\right)^{n}'
    bound_plain: "(3/4 + sqrt(2)/8)**n   # = 0.92677669529...**n"
    general_form_lemma5: >-
      Lemma 5 (p.14): for the n-qudit classical-verification scheme with two bases {e^0_t},{e^1_t}
      of C^d, success probability <= (3/4 + sqrt(c)/4)^n where c = max_{s,t} |<e^0_s|e^1_t>|^2
      (effective overlap; c >= 1/d, footnote 9). Achievable when d = 2. For d = 2 MUB c = 1/2 gives
      3/4 + 1/(4 sqrt 2) = 3/4 + sqrt2/8. Qudit Fourier scheme: (3/4 + 1/(4 sqrt d))^n (Lemma 6, tight).
    variables:
      n: "number of qubits per ticket"
      c: "effective overlap max_{s,t}|<e^0_s|e^1_t>|^2 (Lemma 5)"
      d: "local dimension (d=2 for Wiesner)"
    game_definition: >-
      Ticket = Wiesner-type state with secret key k and serial number. Honest verification: user
      announces serial, bank sends uniformly random challenge c in {0,1}^n (C = {0,1} per qubit);
      user measures qubit i in the computational basis if c_i=0 and in the Hadamard basis if c_i=1
      and reports outcomes; bank accepts iff every position where c_i equals the encoding basis has
      the correct outcome. Valid single-qubit answers: a = t if b = c, any a if b != c (Sec. 4.2).
      Simple counterfeiting attack: from ONE ticket, answer TWO independent uniformly random
      challenges c1, c2 correctly. Attack is modelled as POVMs A^{c1 c2} that depend on BOTH
      challenges (eq. 8, p.13). Verification destroys the ticket (footnote 6).
    assumptions:
      - "ideal states; exact verification of matching-basis positions"
      - "the counterfeiter sees both challenges before measuring (as modelled in eq. 8)"
      - "no additional bank interaction"
    quantifier_over_adversaries: "all POVMs on the ticket conditioned on (c1, c2)"
    tightness: "exact for d = 2 (Lemma 5 'moreover' part)"
    not_valid_for:
      - "W1 (quantum verification): different game, value (3/4)^n"
      - "S1: Kent et al. ideal S-token bound is (1/2 + 1/(2 sqrt2))^N, a different game and value"
      - "noisy/threshold or lossy classical verification"
    verification:
      statement_verbatim: VERIFIED_FROM_SOURCE
      bound_latex: VERIFIED_FROM_SOURCE
      general_form_lemma5: VERIFIED_FROM_SOURCE
      game_definition: VERIFIED_FROM_SOURCE

  - theorem_id: T-MVW12-SEC35
    proof_obligation: null
    game: W1_THRESH_JOINT   # NOT in frozen GameId enum; see handoff interfaces_changed
    source_paper_id: P01
    source_url: https://arxiv.org/abs/1202.4010
    anchor: "Sec. 3.5 'Threshold results', eq.(4) p.10, conditions eq.(5) p.10, proof sketch p.10-11"
    status: VERIFIED_FROM_SOURCE
    statement_summary: >-
      For n-fold repetition where the bank declares the note valid when at least t of n repetitions
      succeed, the optimal counterfeiting probability equals sum_{t<=j<=n} C(n,j) alpha^j (1-alpha)^{n-j}
      (eq. 4), with alpha the single-repetition optimum (3/4 for Wiesner). It holds under
      sum_k p_k |psi_k><psi_k| = (1/d) 1 (eq. 5) and Y = (alpha/d) 1 optimal dual. The paper says this
      holds for Wiesner's scheme and the other schemes it discusses.
    bound_latex: '\sum_{t\le j\le n}\binom{n}{j}\alpha^{j}(1-\alpha)^{n-j}'
    variables:
      n: "repetitions (qubits)"
      t: "required number of successful repetitions"
      alpha: "single-repetition optimal counterfeiting probability"
    game_definition: >-
      The success event counted per repetition is Q_1 = the counterfeit succeeds for BOTH copies in
      that repetition, and the attacker wins if the number of such joint successes is >= t (operator R
      on p.11). This is NOT the realistic noisy game in which each copy separately must pass its own
      threshold test.
    assumptions: ["ideal states", "eq.(5) ensemble condition", "dual Y = (alpha/d) 1 optimal"]
    not_valid_for:
      - "W2 as defined in the master plan (per-copy threshold verifier, noise, loss)"
      - "any honest-noise model: the formula says nothing about honest acceptance"
    verification:
      statement_summary: VERIFIED_FROM_SOURCE
      bound_latex: VERIFIED_FROM_SOURCE
      game_definition: VERIFIED_FROM_SOURCE
      applicability_to_W2: NOT_VERIFIED
    not_verified_reasons:
      applicability_to_W2: "The paper's threshold game counts joint per-repetition successes. Lane A found no published per-copy-threshold BB84 bound in sources read (P13 Pastawski et al. 2012 not read in full)."

  # ------------------------------------------------------------------ Kent, Lowndes, Pitalua-Garcia, Rarity 2022 (P03)
  - theorem_id: T-KLPR22-LEMMA1
    proof_obligation: P-S1
    game: S1
    source_paper_id: P03
    source_url: https://doi.org/10.1038/s41534-022-00524-4
    anchor: "Lemma 1, eq.(1), main text PDF p.5; protocols IQT1/IQT2 in Table 1 (PDF p.3); proof Supplementary Note IV, SI p.5-6 (eqs 47-48), using Lemma 6 (SI Note III)"
    status: VERIFIED_FROM_SOURCE
    statement_verbatim: "Lemma 1: The quantum token schemes IQT1 and IQT2 are eps_unf-unforgeable with eps_unf = (1/2 + 1/(2 sqrt 2))^N."
    bound_latex: '\epsilon_{\mathrm{unf}}=\left(\frac{1}{2}+\frac{1}{2\sqrt{2}}\right)^{N}'
    bound_plain: "(0.5 + 1/(2*sqrt(2)))**N   # base = cos^2(pi/8) = 0.853553390593..."
    variables:
      N: "number of BB84 qubits Bob sends Alice (no losses in the ideal scheme)"
    definitions:
      eps_unf: "eps_unf-unforgeable: probability that Bob accepts Alice's tokens as valid at any two or more different presentation points is <= eps_unf, if Bob follows the scheme honestly (main text p.3)."
    game_definition: >-
      Ideal two-presentation-point scheme (M=1). IQT1 (Table 1): B sends N BB84 states |phi_{t_k u_k}>.
      A measures each in random basis y_k, keeps outcomes x, sends d = y (z=0) or the bitwise
      complement of y (z=1) to B. In stage II, A chooses b, sends c = b xor z. B_i computes d~_i, and
      B_b validates x if x_b = t_b on Delta_b = {k : d~_{b,k} = u_k}. IQT2: A measures all qubits in one
      basis z. Dishonest Alice wins if she gets valid tokens at BOTH Q0 and Q1 (SI p.5: a_0 = t_0
      and b_1 = t_1). Proof: Lemma 6 with gamma_err=0, beta_PB=0, theta=0 (O = 1/sqrt2), so
      lambda = 1/2 - 1/(2 sqrt2) and max ||D_{a,b}|| <= (1-lambda)^N.
    assumptions:
      - "no losses, no errors, exact BB84 states, uniform bases/states (beta_PB = beta_PS = 0)"
      - "secure and authenticated classical channels among agents of the same party; secure labs"
      - "Bob honest (unforgeability is against dishonest Alice)"
    quantifier_over_adversaries: "general cheating strategy: joint projective measurement on the N qubits plus an arbitrary finite-dimensional ancilla (SI p.5)"
    tightness: "upper bound (no tightness claim found in the main text)"
    not_valid_for:
      - "W1 / W1_CV Wiesner games (different game; MVW W1_CV base is 3/4+sqrt2/8 = 0.9268, not 0.8536)"
      - "the realistic schemes QT1/QT2 with loss/noise/bias (use T-KLPR22-THM1)"
      - "2^M presentation points without the Theorem 2 pair-count factor"
    verification:
      statement_verbatim: VERIFIED_FROM_SOURCE
      bound_latex: VERIFIED_FROM_SOURCE
      definitions: VERIFIED_FROM_SOURCE
      game_definition: VERIFIED_FROM_SOURCE

  - theorem_id: T-KLPR22-LEMMA2
    proof_obligation: P-S2
    game: S2
    source_paper_id: P03
    source_url: https://doi.org/10.1038/s41534-022-00524-4
    anchor: "Lemma 2, eqs.(2)-(3), main text PDF p.5; proof Supplementary Note V"
    status: VERIFIED_FROM_SOURCE
    statement_summary: "If 0 < gamma_det < P_det (2), then QT1 and QT2 are eps_rob-robust with (3)."
    bound_latex: '\epsilon_{\mathrm{rob}}=e^{-\frac{P_{\mathrm{det}}N}{2}\left(1-\frac{\gamma_{\mathrm{det}}}{P_{\mathrm{det}}}\right)^{2}}'
    bound_plain: "exp(-(P_det*N/2) * (1 - gamma_det/P_det)**2)"
    preconditions_latex: ['0<\gamma_{\mathrm{det}}<P_{\mathrm{det}}']
    variables: &klpr_vars
      N: "number of quantum states (pulses) Bob sends Alice"
      n: "|Lambda|, number of states Alice reports as successfully measured"
      P_det: "probability that a state transmitted by Bob is reported by Alice as successfully measured"
      gamma_det: "agreed minimum detection rate; Bob aborts unless n >= gamma_det N (Table 2 step 2)"
      gamma_err: "agreed maximum error rate; B_b validates iff d(x_b, r_b) <= |Delta_b| gamma_err (step 12)"
      E: "Alice's error probability when measuring in Bob's preparation basis; E = max_{t,u} E_tu"
      beta_PB: "bias of Bob's preparation-basis distribution: 1/2 - beta_PB <= P^k_PB(u) <= 1/2 + beta_PB, 0 < beta_PB < 1/2"
      beta_PS: "bias of Bob's preparation-state distribution: 1/2 - beta_PS <= P^k_PS(t) <= 1/2 + beta_PS"
      beta_E: "bias of Alice's bit z: 1/2 - beta_E <= P_E(z) <= 1/2 + beta_E"
      P_noqub: "probability that a prepared state has dimension > 2 (photonic: multi-photon pulse); Poisson source P_noqub = 1-(1+mu)e^{-mu}"
      theta: "uncertainty angle on the Bloch sphere of Bob's bases relative to computational/Hadamard, theta in (0, pi/4); also absorbs Alice's measurement misalignment (Table 5 item 5)"
      O_theta: "O(theta) = (cos theta + sin theta)/sqrt2; |<phi_t0|phi_t'1>| <= O(theta) (Table 5 item 2)"
      lambda: "lambda(theta, beta_PB) = (1/2)(1 - sqrt(1 - [1 - O(theta)^2](1 - 4 beta_PB^2))) (Table 5 item 3); 0 < lambda < (1/2)(1 - 1/sqrt2)"
      nu_cor: "free mathematical variable chosen by Alice in Lemma 3"
      nu_unf: "free mathematical variable chosen by Bob in Theorem 1"
      M: "2^M presentation points (Theorem 2)"
      C: "number of pairs of spacelike-separated presentation points (Theorem 2)"
    verification:
      statement_summary: VERIFIED_FROM_SOURCE
      bound_latex: VERIFIED_FROM_SOURCE
      variables: VERIFIED_FROM_SOURCE

  - theorem_id: T-KLPR22-LEMMA3
    proof_obligation: P-S2
    game: S2
    source_paper_id: P03
    source_url: https://doi.org/10.1038/s41534-022-00524-4
    anchor: "Lemma 3, eqs.(4)-(5), main text PDF p.5-6; proof Supplementary Note V"
    status: VERIFIED_FROM_SOURCE
    statement_summary: "If (4) holds, QT1 and QT2 are eps_cor-correct with (5)."
    preconditions_latex:
      - '0<\frac{\gamma_{\mathrm{err}}}{2}<E<\gamma_{\mathrm{err}}'
      - '0<\nu_{\mathrm{cor}}<\frac{P_{\mathrm{det}}(1-2\beta_{\mathrm{PB}})}{2}'
    bound_latex: '\epsilon_{\mathrm{cor}}=e^{-\frac{P_{\mathrm{det}}(1-2\beta_{\mathrm{PB}})N}{4}\left(1-\frac{2\nu_{\mathrm{cor}}}{P_{\mathrm{det}}(1-2\beta_{\mathrm{PB}})}\right)^{2}}+e^{-\frac{E\nu_{\mathrm{cor}}N}{3}\left(\frac{\gamma_{\mathrm{err}}}{E}-1\right)^{2}}'
    bound_plain: "exp(-(P_det*(1-2*beta_PB)*N/4)*(1 - 2*nu_cor/(P_det*(1-2*beta_PB)))**2) + exp(-(E*nu_cor*N/3)*(gamma_err/E - 1)**2)"
    variables: *klpr_vars
    caveat: "As transcribed, precondition (4) requires E > gamma_err/2. That is what the source says (TeX from the article HTML). Don't 'fix' it."
    verification:
      statement_summary: VERIFIED_FROM_SOURCE
      preconditions_latex: VERIFIED_FROM_SOURCE
      bound_latex: VERIFIED_FROM_SOURCE

  - theorem_id: T-KLPR22-LEMMA4
    proof_obligation: P-PRIV
    game: S2
    source_paper_id: P03
    source_url: https://doi.org/10.1038/s41534-022-00524-4
    anchor: "Lemma 4, eq.(6), main text PDF p.5-6; privacy definition p.3; Table 6 assumptions C, D, E, F"
    status: VERIFIED_FROM_SOURCE
    statement_summary: "QT1 and QT2 are eps_priv-private with eps_priv = beta_E."
    bound_latex: '\epsilon_{\mathrm{priv}}=\beta_{\mathrm{E}}'
    definitions:
      eps_priv: "probability that Bob guesses Alice's bit-string b before she presents her token is <= 1/2^M + eps_priv, if Alice is honest and chooses b uniformly (p.3)"
    variables: *klpr_vars
    caveat: "Privacy depends on assumptions C-F (no side channels, detector symmetry). If those aren't met the privacy status is NOT_PROVEN. It doesn't become 0."
    verification:
      statement_summary: VERIFIED_FROM_SOURCE
      bound_latex: VERIFIED_FROM_SOURCE
      definitions: VERIFIED_FROM_SOURCE

  - theorem_id: T-KLPR22-THM1
    proof_obligation: P-S2
    game: S2
    source_paper_id: P03
    source_url: https://doi.org/10.1038/s41534-022-00524-4
    anchor: "Theorem 1, eqs.(7)-(10), main text PDF p.5-6; lambda and O(theta) defined in Table 5 items 2-3 (online table 5); assumptions Table 6 A-G; proof Supplementary Note VII"
    status: VERIFIED_FROM_SOURCE
    statement_summary: >-
      Consider constraints (7) and define f by (8)-(9). There exist parameters satisfying (7) for
      which f > 0. For these parameters, QT1 and QT2 are eps_unf-unforgeable with (10).
    preconditions_latex:
      - '0<\gamma_{\mathrm{err}}<\lambda(\theta,\beta_{\mathrm{PB}})'
      - '0<P_{\mathrm{noqub}}<\nu_{\mathrm{unf}}<\min\left\{2P_{\mathrm{noqub}},\ \gamma_{\mathrm{det}}\left(1-\frac{\gamma_{\mathrm{err}}}{\lambda(\theta,\beta_{\mathrm{PB}})}\right)\right\}'
      - '0<\beta_{\mathrm{PS}}<\frac{1}{2}\left[e^{\frac{\lambda(\theta,\beta_{\mathrm{PB}})}{2}\left(1-\frac{\delta}{\lambda(\theta,\beta_{\mathrm{PB}})}\right)^{2}}-1\right]'
      - 'f(\gamma_{\mathrm{err}},\beta_{\mathrm{PS}},\beta_{\mathrm{PB}},\theta,\nu_{\mathrm{unf}},\gamma_{\mathrm{det}})>0'
    auxiliary_latex:
      f: 'f=(\gamma_{\mathrm{det}}-\nu_{\mathrm{unf}})\left[\frac{\lambda(\theta,\beta_{\mathrm{PB}})}{2}\left(1-\frac{\delta}{\lambda(\theta,\beta_{\mathrm{PB}})}\right)^{2}-\ln(1+2\beta_{\mathrm{PS}})\right]-\left(1-(\gamma_{\mathrm{det}}-\nu_{\mathrm{unf}})\right)\ln\left[1+h(\beta_{\mathrm{PS}},\beta_{\mathrm{PB}},\theta)\right]'
      h: 'h(\beta_{\mathrm{PS}},\beta_{\mathrm{PB}},\theta)=2\beta_{\mathrm{PS}}\sqrt{\frac{1}{2}+2\beta_{\mathrm{PB}}^{2}+\left(\frac{1}{2}-2\beta_{\mathrm{PB}}^{2}\right)\sin(2\theta)}'
      delta: '\delta=\frac{\gamma_{\mathrm{det}}\gamma_{\mathrm{err}}}{\gamma_{\mathrm{det}}-\nu_{\mathrm{unf}}}'
      lambda: '\lambda(\theta,\beta_{\mathrm{PB}})=\frac{1}{2}\left(1-\sqrt{1-[1-(O(\theta))^{2}](1-4\beta_{\mathrm{PB}}^{2})}\right)'
      O: 'O(\theta)=\frac{1}{\sqrt2}(\cos\theta+\sin\theta)'
    bound_latex: '\epsilon_{\mathrm{unf}}=e^{-\frac{P_{\mathrm{noqub}}N}{3}\left(\frac{\nu_{\mathrm{unf}}}{P_{\mathrm{noqub}}}-1\right)^{2}}+e^{-Nf(\gamma_{\mathrm{err}},\beta_{\mathrm{PS}},\beta_{\mathrm{PB}},\theta,\nu_{\mathrm{unf}},\gamma_{\mathrm{det}})}'
    bound_plain: "exp(-(P_noqub*N/3)*(nu_unf/P_noqub - 1)**2) + exp(-N*f)"
    variables: *klpr_vars
    assumptions_table6:
      A: "Bob prepares each qubit state from exactly two orthonormal qubit bases"
      B: "t and u generated with exactly product distributions (no correlations)"
      C: "Lambda gives Bob no information about W and z"
      D: "QT1: conditioned on k in Lambda, Alice's basis is uniform (P_MB = 1/2)"
      E: "Bob cannot use un-agreed degrees of freedom to affect/learn Alice's measurement statistics (no side channels)"
