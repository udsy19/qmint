  - theorem_id: T-KLPR22-LEMMA5
    proof_obligation: P-S2
    game: S2
    source_paper_id: P03
    source_url: https://doi.org/10.1038/s41534-022-00524-4
    anchor: "Methods, Lemma 5, eqs.(12)-(16), PDF p.8; theoretical P_det eq.(17)"
    status: VERIFIED_FROM_SOURCE
    statement_summary: >-
      Under assumptions E and F, reporting strategy 1 (QT1) and 2 (QT2) give report probabilities
      that factorise over pulses and don't depend on the measured basis. So the message m gives Bob
      no information about w_k for k with m_k = 1 (protection against arbitrary multi-photon attacks).
    formulas_latex:
      eq12: 'P^{(1)}_{\mathrm{rep}}(m,w|\rho,L)=\prod_{k=1}^{N}G^{(1)}_{m_k,w_k}(d_0,d_1,\eta,L_k)'
      eq13: 'G^{(1)}_{1,b}=(1-d_0)(1-d_1)(1-\eta/2)^{a}-(1-d_0)^2(1-d_1)^2(1-\eta)^{a};\ G^{(1)}_{0,0}=1-2G^{(1)}_{1,0};\ G^{(1)}_{0,1}=0'
      eq15: 'P^{(2)}_{\mathrm{rep}}(m|w,\rho,L)=\prod_{k=1}^{N}G^{(2)}_{m_k}(d_0,d_1,\eta,L_k)'
      eq16: 'G^{(2)}_{0}=(1-d_0)(1-d_1)(1-\eta)^{a};\ G^{(2)}_{1}=1-(1-d_0)(1-d_1)(1-\eta)^{a}'
      eq17: 'P^{\mathrm{theo}}_{\mathrm{det}}=2\left(e^{-\mu\eta/2}-e^{-\mu\eta}\right)=0.01863\ (\mu=0.09,\eta=0.21)'
    verification:
      statement_summary: VERIFIED_FROM_SOURCE
      formulas_latex: VERIFIED_FROM_SOURCE

  # ------------------------------------------------------------------ Schiansky et al. 2023 (P04)
  - theorem_id: T-SCH23-SDP-N1
    proof_obligation: P-D1
    game: D1
    source_paper_id: P04
    source_url: https://doi.org/10.1038/s41467-023-39519-w
    anchor: "Supplementary Information, Supplementary Note 3A 'For N = 1', eqs.(9)-(15), SI PDF p.4-6; main text Methods 'Optimal cheating strategy'"
    status: VERIFIED_FROM_SOURCE
    statement_summary: >-
      Two-merchant double-spend: from the token state rho_P produce two classical cryptograms
      kappa_0 (Z basis, M0) and kappa_1 (X basis, M1) that both pass. The SDP minimises the error
      e = Tr(E0 J(Lambda)) the adversary must cause while declaring at most l losses per cryptogram.
    sdp_primal: |
      min Tr(E0 J)  s.t.  Tr_{H0 (x) H1}(J) = 1_{HP};  Tr(E0 J) >= Tr(E1 J);  Tr(L0 J) <= l;  Tr(L1 J) <= l;  J >= 0      (eq. 14)
    sdp_dual_as_printed: |
      max Tr[X1] + l (x2 + x3)  s.t.  1_9 (x) X1 + L0 x2 + L1 x3 + (E1 - E0) x4 - E0 <= 0,  X1 Hermitian 2x2, x2,x3,x4 real   (eq. 15)
    spaces: "H0, H1: 3-dim {|a0>,|a1>,|empty>}; HP: 7-dim {|v>,|q0>,|q1>,|m0>..|m3>} (vacuum, qubit, 4 orthogonal multiphoton flags)"
    states: "sigma_k = p0|v><v| + p1 |s_k><s_k| + pm |m_k><m_k| with s_k in {|+>,|+i>,|->,|-i>} (X and Y eigenstates in the SI); rho_P = (1/4) sum_k sigma_k (eq. 9)"
    operators: "E0 = (1/4) sum_{k=0}^{3} (1/2)|a_k^perp><a_k^perp| (x) 1 (x) conj(sigma_k);  E1 = (1/4) sum_k 1 (x) (1/2)|a_k^perp><a_k^perp| (x) conj(sigma_k);  L0 = (1/4) sum_k |empty><empty| (x) 1 (x) conj(sigma_k);  L1 = (1/4) sum_k 1 (x) |empty><empty| (x) conj(sigma_k)  (eqs. 12-13; the 1/2 appears in E0/E1 only, as typeset). P0 = Tr sum_k ((1/2)|a_k^perp><a_k^perp| (x) 1) Lambda((1/4) sigma_k) (eq. 10)."
    observations_for_lane_C:
      - "The SI dual says 'X1 is a hermitian 2x2 matrix' but HP is 7-dimensional, so the dual variable for Tr_{H0H1} J = 1_HP should be 7x7. Either a typo or a different reduced space. Check before reusing it."
      - "SI eq.(6) defines the Choi operator with a 1/d prefactor, J = (1/d) sum Lambda(|i><j|) (x) |i><j|, and states trace preservation as Tr_{out} J = 1. With the 1/d normalisation that should read (1/d)1, so the normalisation convention is internally inconsistent as printed. MVW (P01) uses no 1/d. Lane C must fix one convention and document it."
      - "The SI writes the qubit states as X/Y eigenstates. The main text writes H/V and D/A. That's a relabeling of an unbiased basis pair, but lanes B/C must use one consistent convention (C7: Z/X)."
    verification:
      statement_summary: VERIFIED_FROM_SOURCE
      sdp_primal: VERIFIED_FROM_SOURCE
      sdp_dual_as_printed: VERIFIED_FROM_SOURCE
      operators: VERIFIED_FROM_SOURCE

  - theorem_id: T-SCH23-ASYMPTOTIC
    proof_obligation: P-D1
    game: D1
    source_paper_id: P04
    source_url: https://doi.org/10.1038/s41467-023-39519-w
    anchor: "Supplementary Note 3B, eqs.(16)-(18), SI PDF p.6-7; main text Fig.4a"
    status: VERIFIED_FROM_SOURCE
    statement_summary: >-
      Analytic fit to the optimal cheating boundary: e = -(1/(4+2 sqrt2)) l + (1 - p_m/2)/(8 + 4 sqrt2)
      (16). Equivalently, the secure region is M(e,l) = (4+2 sqrt2) e + l <= (1/2)(1 - p_m/2) (18). N -> infinity
      is justified 'following the exponential de Finetti arguments' (qualitative).
    bound_latex: 'M(e,l)=(4+2\sqrt{2})\,e+l\le\frac{1}{2}\left(1-\frac{p_m}{2}\right)'
    variables:
      e: "fraction of declared outcomes that disagree with (b, B)"
      l: "fraction of token states declared lost"
      p_m: "multiphoton emission probability"
    recomputation: >-
      RECOMPUTED_BY_LANE_A: e*(l=0.224) = 3.795% with p_m=6.76% (main-text value) and 3.822% with
      p_m=6.02% (SI Table 2 value). These match the main-text 3.79% and SI 3.82%. So the two
      documents use different p_m. Allowed mishaps M = 0.5(1-0.0602/2) = 0.48495 matches SI 0.4849.
    caveats:
      - "eq.(16) is described as 'an analytical expression that fits' the SDP optimum. It's a fit, not a derived theorem."
      - "Collective-to-coherent reduction (de Finetti) is argued, not quantified."
    verification:
      statement_summary: VERIFIED_FROM_SOURCE
      bound_latex: VERIFIED_FROM_SOURCE
      recomputation: RECOMPUTED_BY_LANE_A
      coherent_attack_reduction: NOT_VERIFIED
    not_verified_reasons:
      coherent_attack_reduction: "SI Note 3B gives only a qualitative de Finetti argument with no explicit finite-N correction term."

  - theorem_id: T-SCH23-FINITE
    proof_obligation: P-D1
    game: D1
    source_paper_id: P04
    source_url: https://doi.org/10.1038/s41467-023-39519-w
    anchor: "Supplementary Note 3C, eqs.(19)-(23), SI PDF p.7-8; Supplementary Table 2 (SI p.10-11); main text Fig.4b"
    status: VERIFIED_FROM_SOURCE
    statement_summary: >-
      Honest success p_h >= 1 - exp(-(delta_h^2/3) M(e_h,l_h) N) (20), subject to
      M(e_h,l_h)(1+delta_h) < (1/2)(1-p_m/2) (21). Dishonest success
      p_d = P[M(e_d,l_d) <= (1-delta_d)(1/2)(1-p_m/2)] <= exp(-(delta_d^2/2)(1/2)(1-p_m/2) N) (22),
      with (1/2)(1-p_m/2)(1-delta_d) >= M(e_h,l_h)(1+delta_h) (23). N = number of quantum states
      used to verify ONE bit of the cryptogram. Total token length lambda = N log2|m| = N log2 sqrt|C|.
    bound_latex: 'p_d\le\exp\!\left(-\frac{\delta_d^{2}}{2}\cdot\frac{1}{2}\left(1-\frac{p_m}{2}\right)N\right)'
    published_values:
      evidence_kind: PUBLISHED_AGGREGATE
      values: {delta_h: 0.031, delta_d: 0.01, p_d: 5.911e-45, p_d_unc: 0.088e-45, N_fig4: 4.2e6, N_SI_table2: 4482440, p_m_SI: 0.0602, p_m_main: 0.0676}
    recomputation: >-
      RECOMPUTED_BY_LANE_A: exp(-(0.01^2/2)*0.5*(1-0.0602/2)*N) gives 5.91e-45 only with N = 4.2e6
      (exponent 101.84). With the SI Table 2 N = 4,482,440 it gives 6.3e-48. So the reported p_d
      uses N = 4.2e6 and p_m = 6.02%.
    caveats:
      - "Chernoff-Hoeffding (SI eqs 7-8) is for sums of independent {0,1} variables. M = (4+2 sqrt2) e + l is a weighted combination with weight > 1. Lane D must check whether the bound is applied within its hypotheses (open question, NOT a claim of error)."
      - "Independence across the N states is assumed in the Chernoff step."
      - "MAC forgery p_t = 1/sqrt|C| (main text; SI Note 4) is a separate term. The overall cheating probability composition is not stated as a single theorem."
    verification:
      statement_summary: VERIFIED_FROM_SOURCE
      bound_latex: VERIFIED_FROM_SOURCE
      published_values: VERIFIED_FROM_SOURCE
      recomputation: RECOMPUTED_BY_LANE_A
      chernoff_applicability: NOT_VERIFIED
    not_verified_reasons:
      chernoff_applicability: "Needs a formal check by lane D. Lane A only flags it."

  # ------------------------------------------------------------------ Jiang et al. 2024 (P05)
  - theorem_id: T-JIANG24-THM1
    proof_obligation: null
    game: S2_JIANG24   # NOT in frozen GameId enum; distinct theorem from T-KLPR22-THM1
    source_paper_id: P05
    source_url: https://arxiv.org/abs/2408.13063
    anchor: "Methods 'Security analysis', Theorem 1, eqs.(22)-(25), arXiv v2 PDF p.17; parameter-confidence correction eqs.(26)-(29) p.18"
    status: VERIFIED_FROM_SOURCE
    statement_summary: >-
      If max_{j,k} 2 P_MC(chi^k_j) < 1, N gamma_det <= n <= N, and
      0 < P_noqub,theta < nu_unf < gamma_det (1 - gamma_err/(1 - P_bound)), with
      max 2 P_MC <= P_bound < 1, then eps_unf = sum_{l=0}^{floor(N(1-nu_unf))} C(N,l)(1-P_noqub,theta)^l P_noqub,theta^{N-l}
      + sum_{l=0}^{floor(n gamma_err)} C(n - floor(N nu_unf), l)(1-P_bound)^l P_bound^{n - floor(N nu_unf) - l}.
    reported_values:
