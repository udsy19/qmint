# QMint THEOREM REGISTRY SEED (lane A, task A1). Snapshot 2026-10-11.
# Inputs for lanes B (protocols), C (attacks/SDP), D (proof engine), I (compiler).
#
# Rules used when filling this file:
# - Each theorem has a `verification` map that marks every transcribed field as
#   VERIFIED_FROM_SOURCE (read in the primary source at the anchor given) or NOT_VERIFIED
#   (with a reason in `not_verified_reasons`). A third value is used only for derived
#   checks: RECOMPUTED_BY_LANE_A (lane A recomputed a published number from the
#   transcribed formula; that's a numerical consistency check, not a proof).
# - Formulas are in LaTeX (`bound_latex`) and in plain math (`bound_plain`). `bound_plain` is
#   a transcription aid and not a vetted implementation. Lane D must implement from the LaTeX
#   and check against the anchors.
# - A theorem is valid ONLY for its `game`. Don't move a bound across games
#   (W1 != W1_CV != W2 != S1 != S2 != D1 != A1). `not_valid_for` lists known misuses.
# - Probabilities are adversary-success upper bounds (epsilon), never error bars.
# - Source PDFs were hashed when they were read (sha256 below). These are the publisher/arXiv
#   files as downloaded on 2026-10-11. Re-download and compare before relying on page numbers.

