      G: "photonic: from Alice's perspective Bob's pulses are Fock-state mixtures (phase randomised)"
    allowed_imperfections_table5: "items 1-8: multi-photon/non-qubit states (P_noqub); basis uncertainty theta; biases beta_PS, beta_PB; losses (Lambda, gamma_det); arbitrary pair of measurement bases D0, D1; measurement errors (gamma_err); bias beta_E; threshold detectors with dark counts"
    quantifier_over_adversaries: "dishonest Alice, arbitrary quantum strategy; only possible restriction is indirect, through assumption G (Discussion, PDF p.7)"
    out_of_domain_rule: "If (7) fails or f <= 0, the theorem gives no bound. The QMint status must be UNCERTIFIED and must not be extrapolated."
